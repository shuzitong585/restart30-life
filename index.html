<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>30 岁重启人生</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#EDEAE0}
body{color:#22302B;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.75;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;background:#FAF8F3;min-height:100vh;padding:0 0 30px;position:relative;
  box-shadow:0 0 40px rgba(31,61,51,.10)}

/* 顶部状态条 */
#hud{position:sticky;top:0;z-index:20;background:#1F3D33;color:#EFEDE3;padding:9px 14px 10px;display:none}
#hud .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.5px}
#hud .step{color:#C9C2AE}
#hud .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin-top:7px}
#hud .b{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#C9C2AE}
#hud .b .nm{white-space:nowrap}
#hud .b .track{flex:1;height:4px;background:#3A5A4E;border-radius:3px;overflow:hidden}
#hud .b .fill{height:100%;background:#D9C9A8;border-radius:3px;transition:width .35s}
#hud .b .v{width:22px;text-align:right;color:#EFEDE3;font-variant-numeric:tabular-nums}
#hud .b.low .fill{background:#C46A50}

/* 通用 */
.screen{padding:26px 22px 10px}
h1{font-size:26px;font-weight:900;letter-spacing:2px;color:#1F3D33;line-height:1.4}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;border-radius:5px;padding:3px 9px;margin-bottom:12px}
.t-ch{background:#E8F0EC;color:#1F5C46}
.t-fork{background:#FBE9E3;color:#A8442C}
.t-mid{background:#F0EDE2;color:#7A7357}
.t-line{background:#F6E6E6;color:#A33B3B}
.t-rand{background:#E9EEF3;color:#3B5A78}
.stamp{display:inline-block;border:3px solid #A8442C;color:#A8442C;border-radius:9px;padding:9px 18px;
  font-size:20px;font-weight:900;letter-spacing:6px;text-indent:6px;transform:rotate(-4deg);opacity:.9;margin:0 0 20px}
.lead{font-size:14px;color:#5C6A64;line-height:1.95;margin-bottom:16px}
.lead i{font-style:normal;color:#A8442C;font-weight:800}
.rule{height:1px;background:#E4E0D5;margin:18px 0}
.hint{font-size:12px;color:#9AA6A1;line-height:1.85}

/* 按钮 */
.btn{display:block;width:100%;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;
  padding:14px 16px;cursor:pointer;text-align:center;letter-spacing:.5px}
.btn.main{background:#A8442C;color:#fff;box-shadow:0 3px 0 #8A3623}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #8A3623}
.btn.ghost{background:#fff;border:1.5px solid #DDD8C9;color:#3B4A44;font-size:14px}
.btn.ghost:active{background:#F4F1E8}
.btnrow{display:flex;gap:9px;margin-top:10px}
.btnrow .btn{flex:1}
.btn:disabled{opacity:.45}

/* 卡片 */
.card{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:16px;margin-bottom:12px}
.card .k{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#A8442C;margin-bottom:6px}
.card .v{font-size:15px;font-weight:800;color:#1F3D33;line-height:1.6}
.card .d{font-size:12.5px;color:#6E7B75;margin-top:5px;line-height:1.8}
.scene{font-size:15.5px;line-height:1.95;color:#2B3A34;margin-bottom:16px;font-weight:500}
.scene i{font-style:normal;color:#A8442C;font-weight:700}

/* 选项 */
.opt{background:#fff;border:1.5px solid #E4E0D5;border-radius:12px;padding:13px 15px;margin-bottom:9px;
  cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:active{transform:scale(.995)}
.opt .idx{width:22px;height:22px;flex:none;border-radius:50%;background:#F1EFE7;color:#7A7357;
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt .tx{font-size:14.5px;font-weight:700;color:#22302B;line-height:1.65}
.opt .tx .sub{display:block;font-size:12.5px;font-weight:500;color:#7D8A84;margin-top:3px;line-height:1.7}
.opt:hover{border-color:#C9C2AE}
.opt.picked{border-color:#A8442C;background:#FBF3EF}
.opt.picked .idx{background:#A8442C;color:#fff}
.opt.dim{opacity:.45}

/* 反馈 */
.fb{background:#F4F1E8;border-left:4px solid #1F3D33;border-radius:0 12px 12px 0;padding:14px 16px;margin:4px 0 14px}
.fb .ft{font-size:13.5px;color:#2B3A34;line-height:1.9}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.chip.up{background:#E8F0EC;color:#1F5C46}
.chip.dn{background:#F6E6E6;color:#A33B3B}

/* 章节幕 */
.chapter{text-align:center;padding:56px 22px}
.chapter .cn{font-size:13px;font-weight:800;letter-spacing:4px;color:#A8442C;margin-bottom:8px}
.chapter .ct{font-size:24px;font-weight:900;color:#1F3D33;letter-spacing:1px;margin-bottom:6px}
.chapter .cs{font-size:13px;color:#7D8A84;letter-spacing:1px}
.chapter .cd{font-size:13.5px;color:#5C6A64;line-height:1.9;margin-top:16px}

/* 分岔：16 条路线 */
#routes .rg{font-size:12.5px;font-weight:800;color:#1F3D33;margin:16px 0 8px;padding-left:9px;border-left:3px solid #A8442C}
.ropt{background:#fff;border:1.5px solid #E4E0D5;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.ropt:active{transform:scale(.995)}
.ropt .rn{font-size:14.5px;font-weight:800;color:#1F3D33;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ropt .rn span{font-size:11px;font-weight:800;color:#B9B2A0}
.ropt .rm{font-size:12.5px;color:#6E7B75;margin-top:3px;line-height:1.75}
.ropt.sel{border-color:#A8442C;background:#FBF3EF}

/* 结算 */
.endwrap{padding:22px 20px 10px}
.endtitle{text-align:center;margin-bottom:6px}
.endtitle .st{font-size:11.5px;font-weight:800;letter-spacing:3px;color:#9AA6A1}
.endtitle .en{font-size:30px;font-weight:900;color:#1F3D33;letter-spacing:3px;margin:6px 0 4px}
.endtitle .ec{font-size:12.5px;color:#A8442C;font-weight:800;letter-spacing:.5px}
.verdict{border:1.5px dashed #C9A08C;border-radius:12px;padding:14px 16px;margin:16px 0 18px;text-align:center;
  font-size:15px;font-weight:800;color:#8A4A32;line-height:1.85;background:#FDF7F3}
.dossier{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:16px;margin-bottom:12px}
.dossier .dt{font-size:11.5px;font-weight:800;letter-spacing:2px;color:#A8442C;margin-bottom:10px}
.dbar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px}
.dbar .nm{width:34px;color:#5C6A64;font-weight:700}
.dbar .track{flex:1;height:7px;background:#F1EFE7;border-radius:4px;overflow:hidden}
.dbar .fill{height:100%;background:#1F3D33;border-radius:4px}
.dbar .v{width:26px;text-align:right;font-weight:800;color:#1F3D33;font-variant-numeric:tabular-nums}
.dmeta{font-size:12.5px;color:#6E7B75;line-height:1.9;margin-top:10px;padding-top:10px;border-top:1px dashed #E7E2D4}
.dmeta b{color:#1F3D33}
.loglist{font-size:12.5px;color:#5C6A64;line-height:1.9;margin-top:8px}
.loglist div{padding-left:12px;position:relative}
.loglist div:before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:#C9C2AE}
.share{background:#1F3D33;color:#EFEDE3;border-radius:14px;padding:16px;margin-bottom:12px}
.share .st{font-size:13.5px;font-weight:800;margin-bottom:8px;letter-spacing:.5px}
.share .sx{font-size:12.5px;color:#C9C2AE;line-height:1.85;margin-bottom:12px}
.share button{width:100%;border:none;border-radius:10px;background:#D9C9A8;color:#1F3D33;font-family:inherit;
  font-size:13.5px;font-weight:900;padding:11px;cursor:pointer}
</style>
</head>

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function parseDeltas(str){
  var out=[];
  if(!str) return out;
  if(Object.prototype.toString.call(str) === "[object Array]") str = str.join("|");
  str = String(str).replace(/\s+/g,"").replace(/−/g,"-").replace(/—/g,"-");
  str.split("|").forEach(function(p){
    var m = p.match(/^([\u4e00-\u9fa5]+)([+-]\d+)$/);
    if(m) out.push([m[1], parseInt(m[2],10)]);
  });
  return out;
}
function applyDeltas(str){
  var d = parseDeltas(str), txt=[];
  d.forEach(function(x){
    S.a[x[0]] = clamp(S.a[x[0]] + x[1], 0, 100);
    txt.push(x[1] >= 0 ? x[0]+" +"+x[1] : x[0]+" −"+Math.abs(x[1]));
  });
  return txt;
}
function chipHTML(str){
  return parseDeltas(str).map(function(x){
    return '<span class="chip ' + (x[1] >= 0 ? 'up' : 'dn') + '">' + x[0] + (x[1] >= 0 ? ' +' : ' −') + Math.abs(x[1]) + '</span>';
  }).join('');
}

function rollOnce(){
  var a = {"存款":72,"体力":58,"心力":60,"手艺":42,"人脉":38,"名声":22};
  KEYS.forEach(function(k){ a[k] += Math.round((Math.random()-0.5)*12); });
  var job = pick(JOBS), st = pick(STRENGTH), wk = pick(WEAK);
  [job.m, st.m, wk.m].forEach(function(m){
    Object.keys(m).forEach(function(k){ a[k] = clamp(a[k] + m[k], 5, 92); });
  });
  return { a:a, job:job.n, st:st.n, wk:wk.n };
}

/* ==================== 一局的流程 ==================== */
function buildPlan(){
  var ch1 = [1].concat(shuffle([2,3,4,5,6,7]).slice(0,2));
  var p5  = shuffle([36,37,39,40,41,42]);
  var plan = [];
  ch1.forEach(function(n){ plan.push({k:n, ch:1}); });
  plan.push({k:8, ch:2, fork:true});
  plan.push({k:"R1", ch:2}); plan.push({k:9, ch:2}); plan.push({k:13, ch:2}); plan.push({k:"C2", ch:2});
  plan.push({k:18, ch:3}); plan.push({k:"C3", ch:3}); plan.push({k:"R2", ch:3}); plan.push({k:pick([19,20,21,25,26]), ch:3});
  plan.push({k:pick([28,29,30,31,32,33,34,35]), ch:4}); plan.push({k:"R3", ch:4}); plan.push({k:"MID", ch:4});
  plan.push({k:p5[0], ch:5}); plan.push({k:p5[1], ch:5}); plan.push({k:"MID", ch:5});
  plan.push({k:43, ch:6}); plan.push({k:44, ch:6});
  return plan;
}

function newRun(keepRoll){
  var r = keepRoll && lastRoll ? lastRoll : rollOnce();
  lastRoll = r;
  S = { a: JSON.parse(JSON.stringify(r.a)), job:r.job, st:r.st, wk:r.wk,
        route:null, plan:[], i:0, log:[], flags:{}, usedMid:[], shield:false,
        chapterDone:{}, intr:0, stepTotal:0, spent:0 };
  S.plan = buildPlan();
  S.stepTotal = S.plan.length;
  renderCover();
}

/* 生活成本：每进一章扣一次，让「存款」真的会烧 */
function chargeChapter(){
  var cost = 7 + Math.floor(Math.random()*5);      // 7–11
  S.a["存款"] = clamp(S.a["存款"] - cost, 0, 100);
  S.spent = (S.spent||0) + cost;
  return cost;
}

/* 取事件对象 */
function getEvent(item){
  var k = item.k, ch = item.ch;
  if(typeof k === "number"){
    var e = PUBLIC.filter(function(x){ return x.n === k; })[0];
    return { name:e.name, sc:e.sc, opts:e.opts, badge:(e.type==='rand'?'随机遭遇':(e.type==='line'?'存款警戒线':'')),
             cls:(e.type==='rand'?'t-rand':(e.type==='line'?'t-line':'t-ch')) };
  }
  if(k === "R1" || k === "R2" || k === "R3"){
    var r = ROUTE(), e2 = r.ev[parseInt(k[1],10)-1];
    return { name:e2.name, sc:e2.sc, opts:e2.opts, badge:r.name, cls:"t-ch", routeEvent:true };
  }
  if(k === "C2" || k === "C3" || k === 13){
    var n = (k === 13) ? 13 : (k === "C2" ? COND2[ROUTE().group] : COND3[ROUTE().group]);
    var e3 = PUBLIC.filter(function(x){ return x.n === n; })[0];
    var sc = e3.sc, opts = e3.opts;
    if(k === 13){ var v = COND13[ROUTE().group]; sc = v.sc; opts = v.opts; }
    return { name:e3.name, sc:sc, opts:opts, badge:GROUPNAME[ROUTE().group], cls:"t-ch" };
  }
  if(k === "MID"){
    var tags = ch <= 3 ? MID_TAGS_EARLY : MID_TAGS_LATE;
    var pool = EXTRA.mid.filter(function(m){ return tags.indexOf(m.tag) >= 0 && S.usedMid.indexOf(m.name) < 0; });
    var m = pick(pool);
    S.usedMid.push(m.name);
    return { name:m.name, sc:m.sc, opts:m.opts, badge:"路上遇到 · "+m.tag, cls:"t-mid" };
  }
  return { name:"?", sc:"", opts:[], badge:"" };
}

/* 主流程 */
function nextStep(){
  if(S.i >= S.plan.length){ return renderEnding(); }
  var item = S.plan[S.i];
  // 章节幕
  if(S.chapterDone[item.ch] !== true){
    S.chapterDone[item.ch] = true;
    var cost = null;
    if(item.ch > 1){
      cost = chargeChapter();
      if(S.a["存款"] < 20 && !S.shield){
        S.shield = true;
        S.plan.splice(S.i, 0, { k:27, ch:item.ch, line:true });
        S.stepTotal = S.plan.length;
      }
    }
    return showChapter(item.ch, "enterEvent()", cost);
  }
  enterEvent();
}

function enterEvent(){
  var item = S.plan[S.i];
  if(item.fork){ return renderFork(); }
  var e = getEvent(item);
  S.cur = e;
  renderEvent(e);
}

function renderEvent(e){
  var h = '<div class="screen">';
  h += '<div class="tag '+(e.cls||'t-ch')+'">'+(e.badge||'选择')+'</div>';
  h += '<div class="scene">'+e.sc+'</div>';
  e.opts.forEach(function(o,i){
    h += '<div class="opt" id="opt'+i+'" onclick="choose('+i+')">' +
           '<span class="idx">'+"ABC"[i]+'</span>' +
           '<span class="tx">'+o[0]+'</span></div>';

  h += '</div>';
  setView(h);
}

function pick2(i){
  var e = S.cur, o = e.opts[i];
  S.log.push({ e:e.name, c:o[0] });

  setView(h);
}

function choose(i){ pick2(i); }

function afterChoice(){
  S.i++;
  // 存款警戒线
  if(S.a["存款"] < 20 && !S.shield){
    S.shield = true;
    S.plan.splice(S.i, 0, { k:27, ch:Math.max(1,Math.min(5,S.plan[Math.min(S.i,S.plan.length-1)].ch)), line:true });
    S.stepTotal = S.plan.length;
    return renderLineAlert();

}

function markFlags(name, choice){
  if(name === "深夜：要不要回去上班" && choice === "投了") S.flags.jobHunt = true;
  if(name === "前同事来挖你" && choice === "回") S.flags.back = true;
  if(name === "必须找活干" && choice === "回老本行干三个月") S.flags.back = true;
  if(name === "一条突然爆了" && choice === "当天加班，再发三条") S.flags.lucky = true;
  if(name === "供应链的人来找你" && choice.indexOf("播两场") === 0) S.flags.lucky = true;
  if(name === "一次露脸的机会" && choice === "上") S.flags.lucky = true;
  if(name === "回老家" && choice === "回老家") S.flags.home = true;
  if(choice.indexOf("考了个证") >= 0) S.flags.slow = true;
  if(name === "你想什么都不干，歇一整年" && choice === "歇，一整年") S.flags.gap = true;
}

function judge(){
  var a = S.a;
  if(S.route === "oldjob" || S.flags.back) return "回去了";
  if(a["存款"] < 18) return "烧完了";
  if(S.flags.lucky && a["名声"] >= 28) return "侥幸";
  if(a["手艺"] >= 60 && a["名声"] >= 34 && a["存款"] >= 28) return "成了";
  if(a["心力"] >= 64 && a["存款"] >= 24) return "慢下来";
  return "活下来了";
}
function lastChoice(n){ var l = S.log.filter(function(x){ return x.e.indexOf(n) >= 0; }); return l.length ? l[l.length-1].c : ""; }

function renderEnding(){
  var key = judge(), E2 = ENDINGS[key], a = S.a, r = ROUTE();
  var tail43 = { "你在做那件事":"你做的还是那件事。", "你在做别的事":"你做的是别的事，但它还认得你。", "你在别人安排好的位置上":"你在别人安排好的位置上。这天也没出什么错。" }[lastChoice("三年后的某一天")] || "";
  var tail44 = { "是":"这问题你答得很干脆。", "不是，但我在路上":"你在路上。这就够了。", "我不知道":"不知道，也是一种答案。" }[lastChoice("最后一问")] || "";

  var h = '<div class="endwrap">';
  h += '<div class="endtitle"><div class="st">三年后 · 结局</div><div class="en">'+E2.n+'</div><div class="ec">'+E2.c+'</div></div>';
  h += '<div class="card" style="background:#fff"><div class="k">三年后的这一天</div><div class="d" style="font-size:13.5px;color:#3B4A44;line-height:1.95">'+
       E2.s+' '+(tail43||"")+'</div></div>';
  h += '<div class="verdict">'+E2.v+'<br><span style="font-size:12.5px;font-weight:600;color:#9A7A6A">'+(tail44||"")+'</span></div>';

  h += '<div class="dossier"><div class="dt">人 生 档 案</div>';
  KEYS.forEach(function(k){
    h += '<div class="dbar"><span class="nm">'+k+'</span><span class="track"><span class="fill" style="width:'+a[k]+'%"></span></span><span class="v">'+a[k]+'</span></div>';
  });
  h += '<div class="dmeta">走的路：<b>'+r.name+'</b>（'+GROUPNAME[r.group]+'）<br>'+
       '离开的那份工作：<b>'+S.job+'</b><br>'+
       '一共走了 <b>'+S.stepTotal+'</b> 步，做了 <b>'+S.stepTotal+'</b> 个选择'+
       (S.spent?'<br>三年里，光生活成本就花掉了 <b>'+S.spent+'</b>':'')+
       (S.shield?'<br><span style="color:#A33B3B;font-weight:700">中途存款见了底，被迫去找过活干</span>':'')+'</div>';
  var lg = S.log.slice(-6);
  h += '<div class="loglist">'+lg.map(function(x){ return '<div>'+x.e+' → '+x.c+'</div>'; }).join('')+'</div>';
  h += '</div>';

  var shareTxt = "30 岁那年我辞了职。三年后，我的结局是【"+E2.n+"】。"+E2.v+
    "（走的是「"+r.name+"」这条路人 生档案：手艺"+a["手艺"]+" 名声"+a["名声"]+" 存款"+a["存款"]+"）你敢试一局吗？";
  h += '<div class="share"><div class="st">这一局走完了</div>' +
       '<div class="sx">把这份人生档案发出去，看看你朋友三年后活成什么样。</div>' +
       '<button onclick="copyShare()" id="cpBtn">复制这一局的结果</button></div>';
  h += '<button class="btn main" onclick="newRun(false)">再抽一局人生</button>';
  h += '<div class="btnrow"><button class="btn ghost" onclick="restartSameRoll()">同一份底牌，换一条路</button></div>';
  h += '<div class="hint" style="margin-top:14px">你的结局有 6 种，路线有 16 条。同一份底牌，换个走法就是另一个人生。</div>';
  h += '</div>';
  S.shareTxt = shareTxt;
  hud.style.display='none';
  view.innerHTML = h; window.scrollTo(0,0);
}
function restartSameRoll(){ newRun(true); renderRoll(); }
function copyShare(){
  var t = S.shareTxt || "";
  var done = function(){ var b = document.getElementById('cpBtn'); if(b){ b.textContent = "已复制 ✓"; } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); }); }
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  var ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* ==================== 启动 ==================== */
newRun(false);
</script>
